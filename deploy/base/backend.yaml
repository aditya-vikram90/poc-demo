apiVersion: apps/v1
kind: Deployment
metadata: {name: backend, namespace: poc}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: poc-backend:a5d56ba
        ports: [{containerPort: 8080}]
        env:
        - {name: MONGO_URL, value: "mongodb://mongo:27017/appdb"}
        - {name: REDIS_URL, value: "redis://redis:6379"}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: poc}
spec: {selector: {app: backend}, ports: [{port: 8080}]}
